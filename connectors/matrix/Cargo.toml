[package]
name = "missioncontrol-matrix"
version = "1.0.0-alpha.0"
edition = "2024"
rust-version = "1.96"
license = "AGPL-3.0-only"
publish = false

[dependencies]
matrix-sdk = { version = "=0.19.1", default-features = false, features = ["e2e-encryption", "sqlite", "bundled-sqlite", "rustls-aws-lc-rs"] }
tokio = { version = "1.50", features = ["macros", "rt-multi-thread"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
fs2 = "0.4"
libc = "0.2"
matrix-sdk-crypto = "=0.19.1"
reqwest = { version = "0.13", default-features = false, features = ["json"] }

[dev-dependencies]
tempfile = "3"
