name: Public candidate checks
on: [workflow_dispatch]
permissions:
  contents: read
jobs:
  core:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 24.21.0
          cache: npm
      - run: sudo apt-get update && sudo apt-get install -y age
      - run: npm ci --ignore-scripts
      - run: rustup toolchain install 1.96.0 --profile minimal
      - run: python3 -B scripts/verify.py --lane linux --logs "$RUNNER_TEMP/mission-control-verify"
  macos:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 24.21.0
          cache: npm
      - run: brew install age
      - run: npm ci --ignore-scripts
      - run: python3 -B scripts/verify.py --lane macos --logs "$RUNNER_TEMP/mission-control-verify"
